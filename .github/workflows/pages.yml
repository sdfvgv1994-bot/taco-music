# 把網站放上 GitHub Pages：main 有改動就自動更新
name: 網站上線

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 網址加上版本號（?v=提交代號）：避免瀏覽器用存了 10 分鐘的舊程式；順便填版本號和部署時間（台北時間）
      - name: 加上版本號
        run: |
          v="${GITHUB_SHA::7}"
          mkdir -p site && cp index.html core.js app.js sw.js manifest.json *.png site/
          sed -i -E "s#src=\"(core|app)\.js\"#src=\"\1.js?v=$v\"#g" site/index.html
          grep -c "?v=$v" site/index.html
          sed -i "s#name=\"app-version\" content=\"dev\"#name=\"app-version\" content=\"$v\"#" site/index.html
          sed -i "s#name=\"app-built\" content=\"\"#name=\"app-built\" content=\"$(TZ=Asia/Taipei date '+%m/%d %H:%M')\"#" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
